# ============================================
# Plazo — nginx container config (production + dev)
# Dipakai oleh deploy/web/docker-compose.yml
# Service names dalam docker network:
#   frontend-prod:3000 | backend-prod:3001
#   frontend-dev:3000 | backend-dev:3001
# SSL: Cloudflare Origin Certificate (Full strict)
# ============================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name plazo.id www.plazo.id *.plazo.id api.plazo.id
                dev.plazo.id *.dev.plazo.id api-dev.plazo.id;

    return 301 https://$host$request_uri;
}

# ============ PRODUCTION ============

# Canonical redirect www.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.plazo.id;

    ssl_certificate /etc/ssl/cloudflare/plazo.id.pem;
    ssl_certificate_key /etc/ssl/cloudflare/plazo.id.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    return 301 https://plazo.id$request_uri;
}

# Backend API + Socket.IO (production)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.plazo.id;

    ssl_certificate /etc/ssl/cloudflare/plazo.id.pem;
    ssl_certificate_key /etc/ssl/cloudflare/plazo.id.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 10m;

    access_log /var/log/nginx/plazo-api.access.log;
    error_log /var/log/nginx/plazo-api.error.log;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://backend-prod:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}

# Main website + storefront wildcard (production)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name plazo.id *.plazo.id;

    ssl_certificate /etc/ssl/cloudflare/plazo.id.pem;
    ssl_certificate_key /etc/ssl/cloudflare/plazo.id.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 10m;

    access_log /var/log/nginx/plazo-web.access.log;
    error_log /var/log/nginx/plazo-web.error.log;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location /_next/static/ {
        proxy_pass http://frontend-prod:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://frontend-prod:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}

