# ============================================
# Override DEV-ONLY untuk deploy/web/docker-compose.yml
# Dipakai saat produksi belum aktif — hanya menjalankan service dev + nginx.
# Jalankan:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d backend-dev frontend-dev nginx
# ============================================
services:
  nginx:
    volumes:
      - ./nginx/plazo-dev.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro
    depends_on:
      - frontend-dev
      - backend-dev
