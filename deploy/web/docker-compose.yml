# ============================================
# Plazo — VPS-1 (WEB): production + dev
# 4 service aplikasi + nginx reverse proxy.
# Images ditarik dari GHCR (di-push oleh GitHub Actions).
# ============================================
services:
  # ============ PRODUCTION ============
  backend-prod:
    image: ghcr.io/${GHCR_OWNER}/plazo-backend:prod
    container_name: plazo-backend-prod
    restart: unless-stopped
    env_file:
      - .env.backend-prod
    volumes:
      - plazo_uploads_prod:/app/uploads
    networks:
      - plazo-net

  frontend-prod:
    image: ghcr.io/${GHCR_OWNER}/plazo-frontend:prod
    container_name: plazo-frontend-prod
    restart: unless-stopped
    depends_on:
      - backend-prod
    networks:
      - plazo-net

  # ============ dev ============
  backend-dev:
    image: ghcr.io/${GHCR_OWNER}/plazo-backend:dev
    container_name: plazo-backend-dev
    restart: unless-stopped
    env_file:
      - .env.backend-dev
    volumes:
      - plazo_uploads_dev:/app/uploads
    networks:
      - plazo-net

  frontend-dev:
    image: ghcr.io/${GHCR_OWNER}/plazo-frontend:dev
    container_name: plazo-frontend-dev
    restart: unless-stopped
    depends_on:
      - backend-dev
    networks:
      - plazo-net

  # ============ NGINX (reverse proxy) ============
  nginx:
    image: nginx:1.27-alpine
    container_name: plazo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Pilih config nginx: default = full (prod+dev), atau dev-only via NGINX_CONF=./nginx/plazo-dev.conf
      - ${NGINX_CONF:-./nginx/plazo.id.conf}:/etc/nginx/conf.d/default.conf:ro
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro
    depends_on:
      - frontend-prod
      - backend-prod
      - frontend-dev
      - backend-dev
    networks:
      - plazo-net

networks:
  plazo-net:
    driver: bridge

volumes:
  plazo_uploads_prod:
  plazo_uploads_dev:
