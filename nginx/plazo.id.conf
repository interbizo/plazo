# Nginx reverse proxy for Plazo production (Cloudflare Proxy mode).
# Copy to: /etc/nginx/sites-available/plazo.id
# Enable with: sudo ln -s /etc/nginx/sites-available/plazo.id /etc/nginx/sites-enabled/
#
# SSL: Using Cloudflare Origin Certificate (Full Strict mode)
# Generate at: Cloudflare Dashboard > SSL/TLS > Origin Server > Create Certificate
# Save cert to: /etc/ssl/cloudflare/plazo.id.pem
# Save key to:  /etc/ssl/cloudflare/plazo.id.key
#
# Cloudflare settings:
# - SSL/TLS mode: Full (strict)
# - Always Use HTTPS: ON
# - Minimum TLS: 1.2

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream plazo_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream plazo_backend {
    server 127.0.0.1:3001;
    keepalive 32;
}

# HTTP -> HTTPS redirect (Cloudflare handles this, but keep as safety net)
server {
    listen 80;
    listen [::]:80;
    server_name plazo.id www.plazo.id *.plazo.id api.plazo.id;

    return 301 https://$host$request_uri;
}

# Canonical redirect for www.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.plazo.id;

    ssl_certificate /etc/ssl/cloudflare/plazo.id.pem;
    ssl_certificate_key /etc/ssl/cloudflare/plazo.id.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    return 301 https://plazo.id$request_uri;
}

# Backend API and Socket.IO.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.plazo.id;

    ssl_certificate /etc/ssl/cloudflare/plazo.id.pem;
    ssl_certificate_key /etc/ssl/cloudflare/plazo.id.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 10m;

    access_log /var/log/nginx/plazo-api.access.log;
    error_log /var/log/nginx/plazo-api.error.log;

    # Security headers for API
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://plazo_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}

# Main website and seller storefront wildcard.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name plazo.id *.plazo.id;

    ssl_certificate /etc/ssl/cloudflare/plazo.id.pem;
    ssl_certificate_key /etc/ssl/cloudflare/plazo.id.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 10m;

    access_log /var/log/nginx/plazo-web.access.log;
    error_log /var/log/nginx/plazo-web.error.log;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # NO CSP header here — let Cloudflare or the app handle it
    # CSP from nginx conflicts with Cloudflare scripts (Insights, Turnstile, etc.)

    location /_next/static/ {
        proxy_pass http://plazo_frontend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://plazo_frontend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
