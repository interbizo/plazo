name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            echo "=========================================="
            echo "  PLAZO MARKETPLACE — AUTO DEPLOY"
            echo "  $(date '+%Y-%m-%d %H:%M:%S')"
            echo "=========================================="
            
            APP_DIR="/home/deploy/apps/plazo"
            cd "$APP_DIR"
            
            # Pull latest code
            echo "[1/8] Pulling latest code..."
            git pull origin main
            
            # Backend
            echo "[2/8] Installing backend dependencies..."
            cd "$APP_DIR/backend"
            npm ci --production
            
            echo "[3/8] Generating Prisma client..."
            npx prisma generate
            
            echo "[4/8] Running database migrations..."
            npx prisma migrate deploy
            
            echo "[5/8] Building backend..."
            npm run build
            
            echo "[6/8] Restarting backend..."
            pm2 reload plazo-backend --update-env
            
            # Frontend
            echo "[7/8] Building frontend..."
            cd "$APP_DIR/frontend"
            npm ci
            npm run build
            
            echo "[8/8] Restarting frontend..."
            pm2 reload plazo-frontend --update-env
            
            # Save PM2 state
            pm2 save
            
            echo ""
            echo "✅ Deploy complete!"
            pm2 status
