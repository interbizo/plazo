name: Deploy Plazo ke VPS

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

# Production dan development menggunakan VPS + working directory yang sama.
# Jangan jalankan dua deployment bersamaan karena keduanya mengubah /opt/plazo.
concurrency:
  group: plazo-vps-deployment
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/plazo

jobs:
  # ============================================================
  # PRODUCTION
  # Branch: main
  # ============================================================
  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # ----------------------------------------------------------
      # Checkout source code
      # ----------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Login ke GitHub Container Registry
      # ----------------------------------------------------------
      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------
      # Build & Push Frontend Production
      # ----------------------------------------------------------
      - name: Build & push Frontend (prod)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          no-cache: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:prod
            ${{ env.IMAGE_PREFIX }}-frontend:prod-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ secrets.NEXT_PUBLIC_WS_URL }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_BASE_DOMAIN=${{ secrets.NEXT_PUBLIC_BASE_DOMAIN }}
            NEXT_PUBLIC_MAIN_DOMAIN=${{ secrets.NEXT_PUBLIC_MAIN_DOMAIN }}
            NEXT_PUBLIC_MAIN_DOMAIN_URL=${{ secrets.NEXT_PUBLIC_MAIN_DOMAIN_URL }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_S3_PUBLIC_URL=${{ secrets.NEXT_PUBLIC_S3_PUBLIC_URL }}

      # ----------------------------------------------------------
      # Build & Push Backend Production
      # ----------------------------------------------------------
      - name: Build & push Backend (prod)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          no-cache: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:prod
            ${{ env.IMAGE_PREFIX }}-backend:prod-${{ github.sha }}

      # ----------------------------------------------------------
      # Deploy Production ke VPS
      # ----------------------------------------------------------
      - name: Deploy ke VPS-1 (web) — production
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}

          script: |
            set -euo pipefail

            echo "========================================"
            echo "Deploy PRODUCTION Plazo"
            echo "Commit: ${{ github.sha }}"
            echo "========================================"

            cd /opt/plazo

            echo "1. Sinkronisasi branch main..."
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            echo "Current branch:"
            git branch --show-current

            echo "Current commit:"
            git rev-parse HEAD

            echo "2. Update Docker Compose dan Nginx..."
            cp deploy/web/docker-compose.yml docker-compose.yml

            mkdir -p nginx
            cp deploy/web/nginx/*.conf nginx/

            export GHCR_OWNER=${{ github.repository_owner }}

            echo "3. Validasi Docker Compose..."
            docker compose config > /dev/null

            echo "4. Pull image production terbaru..."
            docker compose pull backend-prod frontend-prod

            echo "5. Jalankan Prisma migration production..."
            docker compose run --rm backend-prod \
              npx --yes prisma migrate deploy

            echo "6. Recreate container production..."
            docker compose up -d \
              --force-recreate \
              backend-prod \
              frontend-prod

            echo "7. Recreate Nginx..."
            docker compose up -d \
              --force-recreate \
              nginx

            echo "8. Status container..."
            docker compose ps

            echo "========================================"
            echo "Production deploy berhasil"
            echo "Commit: $(git rev-parse HEAD)"
            echo "Waktu: $(date)"
            echo "========================================"

  # ============================================================
  # DEVELOPMENT / STAGING
  # Branch: develop
  # ============================================================
  deploy-dev:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # ----------------------------------------------------------
      # Checkout source code
      # ----------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ----------------------------------------------------------
      # Login ke GitHub Container Registry
      # ----------------------------------------------------------
      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------
      # Build & Push Frontend Development
      # ----------------------------------------------------------
      - name: Build & push Frontend (dev)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          no-cache: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:dev
            ${{ env.IMAGE_PREFIX }}-frontend:dev-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL_DEV }}
            NEXT_PUBLIC_WS_URL=${{ secrets.NEXT_PUBLIC_WS_URL_DEV }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL_DEV }}
            NEXT_PUBLIC_BASE_DOMAIN=${{ secrets.NEXT_PUBLIC_BASE_DOMAIN_DEV }}
            NEXT_PUBLIC_MAIN_DOMAIN=${{ secrets.NEXT_PUBLIC_MAIN_DOMAIN_DEV }}
            NEXT_PUBLIC_MAIN_DOMAIN_URL=${{ secrets.NEXT_PUBLIC_MAIN_DOMAIN_URL_DEV }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY_DEV }}
            NEXT_PUBLIC_S3_PUBLIC_URL=${{ secrets.NEXT_PUBLIC_S3_PUBLIC_URL_DEV }}

      # ----------------------------------------------------------
      # Build & Push Backend Development
      # ----------------------------------------------------------
      - name: Build & push Backend (dev)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          no-cache: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:dev
            ${{ env.IMAGE_PREFIX }}-backend:dev-${{ github.sha }}

      # ----------------------------------------------------------
      # Deploy Development ke VPS
      # ----------------------------------------------------------
      - name: Deploy ke VPS-1 (web) — dev
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_SSH_PORT || 22 }}

          script: |
            set -euo pipefail

            echo "========================================"
            echo "Deploy DEVELOPMENT Plazo"
            echo "Commit: ${{ github.sha }}"
            echo "========================================"

            cd /opt/plazo

            echo "1. Sinkronisasi branch develop..."
            git fetch origin develop
            git checkout develop
            git reset --hard origin/develop

            echo "Current branch:"
            git branch --show-current

            echo "Current commit:"
            git rev-parse HEAD

            echo "2. Update Docker Compose dan Nginx..."
            cp deploy/web/docker-compose.yml docker-compose.yml

            mkdir -p nginx
            cp deploy/web/nginx/*.conf nginx/

            export GHCR_OWNER=${{ github.repository_owner }}

            echo "3. Validasi Docker Compose..."
            docker compose config > /dev/null

            echo "4. Pull image development terbaru..."
            docker compose pull backend-dev frontend-dev

            echo "5. Jalankan Prisma migration development..."
            docker compose run --rm backend-dev \
              npx --yes prisma migrate deploy

            echo "6. Recreate container development..."
            docker compose up -d \
              --force-recreate \
              backend-dev \
              frontend-dev

            echo "7. Recreate Nginx..."
            docker compose up -d \
              --force-recreate \
              nginx

            echo "8. Status container..."
            docker compose ps

            echo "========================================"
            echo "Development deploy berhasil"
            echo "Commit: $(git rev-parse HEAD)"
            echo "Waktu: $(date)"
            echo "========================================"
